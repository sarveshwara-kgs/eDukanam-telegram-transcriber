server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: telegram-transcription

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    api-base-url: https://api.telegram.org
    # If set, the webhook controller validates this secret against the
    # X-Telegram-Bot-Api-Secret-Token header Telegram sends on every request.
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

groq:
  api:
    key: ${GROQ_API_KEY}
    base-url: https://api.groq.com/openai/v1
    model: ${GROQ_MODEL:whisper-large-v3-turbo}
    vision-model: ${GROQ_VISION_MODEL:qwen/qwen3.6-27b}
  transcription:
    # Mode: FORCED_LANGUAGE (default) or FILTERED_LANGUAGES
    mode: ${GROQ_TRANSCRIPTION_MODE:FORCED_LANGUAGE}
    # Used when mode is FORCED_LANGUAGE (e.g. "te" for Telugu)
    language: ${GROQ_TRANSCRIPTION_LANGUAGE:te}
    # Used when mode is FILTERED_LANGUAGES (comma-separated list of allowed languages)
    allowed-languages: ${GROQ_ALLOWED_LANGUAGES:te,telugu,en,english}

logging:
  level:
    root: INFO
    com.example.telegramtranscription: DEBUG
